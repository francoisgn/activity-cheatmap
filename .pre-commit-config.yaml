# Hooks run on every commit (and replayed in CI). Pinned versions = same
# results on every machine. Update: pre-commit autoupdate
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: local
    hooks:
      - id: unittest
        name: unit tests
        entry: python3 -m unittest discover -s tests
        language: system
        types: [python]
        pass_filenames: false
