[build-system]
requires = ["setuptools>=77"]  # PEP 639 license expressions
build-backend = "setuptools.build_meta"

[project]
name = "activity-cheatmap"
dynamic = ["version"]
description = "Draw patterns on your GitHub contribution graph with backdated commits"
readme = "README.md"
license = "LicenseRef-PolyForm-Strict-1.0.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml"]
image = ["pillow"]
all = ["pyyaml", "pillow"]

[project.scripts]
cheatmap = "cheatmap.cli:main"

[tool.setuptools]
packages = ["cheatmap"]

[tool.setuptools.dynamic]
version = { attr = "cheatmap.__version__" }

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
